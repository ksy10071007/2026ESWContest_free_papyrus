<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 촬영 - 종합 건강 스크리닝</title>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
        })();
    </script>
    <style>
        :root {
            --primary: #007aff;
            --primary-soft: #eaf3ff;
            --bg: #f5f5f7;
            --surface: #ffffff;
            --text: #172033;
            --sub: #667085;
            --border: #d9e0ea;
            --success: #138a52;
            --danger: #b42318;
        }
        [data-theme="dark"] {
            --primary: #58a6ff;
            --primary-soft: #142a42;
            --bg: #0f1115;
            --surface: #171b22;
            --text: #eef2f7;
            --sub: #a7b0bf;
            --border: #303846;
            --success: #4fd18b;
            --danger: #ff8b83;
        }
        * { box-sizing: border-box; }
        body { margin: 0; width: 100%; min-height: 800px; background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        .page { min-height: 800px; padding: 32px 54px 38px; display: flex; flex-direction: column; }
        header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
        .eyebrow { color: var(--primary); font-weight: 800; margin-bottom: 7px; }
        h1 { margin: 0; font-size: 2.15rem; letter-spacing: 0; }
        .progress { color: var(--sub); font-weight: 700; }
        .workspace { min-height: 580px; display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, 0.8fr); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
        .capture-panel { min-width: 0; padding: 22px; display: flex; flex-direction: column; }
        .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 310px; padding: 5px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 16px; }
        .mode-tab { min-height: 40px; border: 0; border-radius: 6px; background: transparent; color: var(--sub); font-weight: 800; cursor: pointer; }
        .mode-tab.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 8px rgba(15, 23, 42, 0.09); }
        .preview { position: relative; flex: 1; min-height: 400px; display: grid; place-items: center; overflow: hidden; border-radius: 8px; background: #0d1117; }
        .preview img { display: none; width: 100%; height: 100%; object-fit: contain; }
        .preview img.visible { display: block; }
        .preview-message { width: min(420px, 86%); color: #cbd5e1; text-align: center; line-height: 1.55; word-break: keep-all; }
        .preview-message strong { display: block; color: #fff; font-size: 1.08rem; margin-bottom: 6px; }
        .live-badge { position: absolute; top: 14px; left: 14px; display: none; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 6px; background: rgba(15, 23, 42, 0.82); color: #fff; font-size: 0.78rem; font-weight: 800; }
        .live-badge.visible { display: flex; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        .capture-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
        .details { border-left: 1px solid var(--border); padding: 26px 24px; display: flex; flex-direction: column; }
        .details h2 { margin: 0 0 20px; font-size: 1.2rem; }
        .detail-list { display: grid; gap: 16px; }
        .detail { padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .detail:last-child { border-bottom: 0; }
        .detail-label { color: var(--sub); font-size: 0.82rem; font-weight: 700; margin-bottom: 5px; }
        .detail-value { font-weight: 800; line-height: 1.45; overflow-wrap: anywhere; }
        .model-note { margin-top: 20px; padding: 14px; border-radius: 8px; background: var(--primary-soft); color: var(--sub); font-size: 0.88rem; line-height: 1.5; }
        .message { min-height: 22px; margin-top: auto; padding-top: 18px; color: var(--sub); font-size: 0.88rem; line-height: 1.45; }
        .message.error { color: var(--danger); font-weight: 700; }
        footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 18px; }
        .btn { min-height: 50px; padding: 0 22px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 1rem; font-weight: 800; cursor: pointer; }
        .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn:disabled { background: #aab3c2; border-color: #aab3c2; color: #fff; cursor: not-allowed; }
        .footer-actions { display: flex; gap: 10px; }
        input[type="file"] { display: none; }
        @media (max-width: 768px) {
            body { width: 100%; min-height: 100vh; }
            .page { min-height: 100vh; padding: 20px 14px 26px; }
            header { align-items: flex-start; flex-direction: column; gap: 10px; }
            h1 { font-size: 1.75rem; }
            .workspace { min-height: 0; grid-template-columns: 1fr; overflow: visible; }
            .capture-panel { padding: 14px; }
            .mode-tabs { width: 100%; }
            .preview { min-height: 320px; aspect-ratio: 4 / 3; }
            .details { border-left: 0; border-top: 1px solid var(--border); padding: 20px 16px; }
            .model-note { margin-top: 14px; }
            footer { align-items: stretch; flex-direction: column; }
            .footer-actions { display: grid; grid-template-columns: 1fr 1.4fr; }
            .btn { padding: 0 12px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <div>
                <div class="eyebrow">종합 건강 스크리닝 · 이미지 입력</div>
                <h1 id="page-title">이미지를 준비해 주세요</h1>
            </div>
            <div id="progress" class="progress"></div>
        </header>

        <section class="workspace">
            <div class="capture-panel">
                <div class="mode-tabs" role="tablist" aria-label="입력 방식">
                    <button id="camera-tab" class="mode-tab active" type="button" role="tab" aria-selected="true">카메라</button>
                    <button id="upload-tab" class="mode-tab" type="button" role="tab" aria-selected="false">이미지 업로드</button>
                </div>

                <div class="preview">
                    <img id="live-feed" alt="카메라 실시간 화면">
                    <img id="captured-image" alt="선택한 검사 이미지">
                    <div id="preview-message" class="preview-message"></div>
                    <div id="live-badge" class="live-badge"><span class="live-dot"></span>LIVE</div>
                </div>

                <div class="capture-actions">
                    <button id="input-button" class="btn btn-primary" type="button">촬영하기</button>
                    <button id="clear-button" class="btn" type="button" disabled>다시 준비</button>
                </div>
                <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp">
            </div>

            <aside class="details">
                <h2>촬영 정보</h2>
                <div class="detail-list">
                    <div class="detail"><div class="detail-label">검사 영역</div><div id="modality-label" class="detail-value"></div></div>
                    <div class="detail"><div class="detail-label">권장 입력</div><div id="capture-label" class="detail-value"></div></div>
                    <div class="detail"><div class="detail-label">연결 카메라</div><div id="camera-name" class="detail-value">확인 중</div></div>
                    <div class="detail"><div class="detail-label">입력 상태</div><div id="input-status" class="detail-value">준비 중</div></div>
                </div>
                <div class="model-note">현재 피부·두피 모델은 연결 전입니다. 촬영 데이터만 확보하며 임시 진단값은 생성하지 않습니다.</div>
                <div id="message" class="message" aria-live="polite"></div>
            </aside>
        </section>

        <footer>
            <button class="btn" type="button" onclick="location.href='/screening'">검사 선택으로</button>
            <div class="footer-actions">
                <button class="btn" type="button" onclick="location.href='/screening/survey'">문진 수정</button>
                <button id="continue-button" class="btn btn-primary" type="button" disabled>이미지 확인</button>
            </div>
        </footer>
    </main>

    <script src="/static/js/screening-flow.js"></script>
    <script>
        const active = ScreeningFlow.getActive();
        const plan = ScreeningFlow.getPlan();
        if (active === 'eye') location.replace('/capture');
        if (!['skin', 'scalp'].includes(active) || !plan.includes(active)) location.replace('/screening');

        const isMobile = window.matchMedia('(max-width: 768px)').matches;
        let inputMode = 'camera';
        let cameraSessionActive = false;
        let captureData = '';
        let modalityConfig = null;

        const liveFeed = document.getElementById('live-feed');
        const capturedImage = document.getElementById('captured-image');
        const previewMessage = document.getElementById('preview-message');
        const liveBadge = document.getElementById('live-badge');
        const fileInput = document.getElementById('file-input');
        const inputButton = document.getElementById('input-button');
        const clearButton = document.getElementById('clear-button');
        const continueButton = document.getElementById('continue-button');
        const message = document.getElementById('message');

        function setMessage(text, isError = false) {
            message.textContent = text;
            message.classList.toggle('error', isError);
        }

        function cameraRoleLabel() {
            return modalityConfig?.camera_role === 'usb_microscope'
                ? 'USB 현미경 카메라'
                : '일반 웹캠';
        }

        function updatePreviewState() {
            const hasCapture = Boolean(captureData);
            capturedImage.classList.toggle('visible', hasCapture);
            liveFeed.classList.toggle('visible', !hasCapture && inputMode === 'camera' && !isMobile && cameraSessionActive);
            liveBadge.classList.toggle('visible', !hasCapture && inputMode === 'camera' && !isMobile && cameraSessionActive);
            previewMessage.hidden = hasCapture || (!isMobile && inputMode === 'camera' && cameraSessionActive);
            clearButton.disabled = !hasCapture;
            continueButton.disabled = !hasCapture;
            document.getElementById('input-status').textContent = hasCapture ? '이미지 확보 완료' : '이미지 대기';

            if (!hasCapture) {
                if (inputMode === 'upload') {
                    previewMessage.innerHTML = '<strong>이미지를 업로드하세요</strong>JPG, PNG 또는 WebP 파일을 선택할 수 있습니다.';
                } else if (isMobile) {
                    previewMessage.innerHTML = '<strong>모바일 카메라를 사용합니다</strong>아래 촬영 버튼을 누르면 기기 카메라가 열립니다.';
                } else if (!cameraSessionActive) {
                    previewMessage.innerHTML = '<strong>카메라 연결 중</strong>잠시만 기다려 주세요.';
                }
            }
        }

        async function startCamera() {
            if (isMobile || cameraSessionActive || inputMode !== 'camera') return;
            const cameraRole = modalityConfig?.camera_role || 'webcam';
            setMessage(`${cameraRoleLabel()} 세션을 시작하는 중입니다.`);
            updatePreviewState();
            try {
                const response = await fetch('/camera/session/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source: 'screening_capture', camera_role: cameraRole })
                });
                const payload = await response.json();
                if (!response.ok || payload.status !== 'ok') throw new Error(payload.message || '카메라 시작 실패');
                cameraSessionActive = true;
                if (payload.camera) renderCameraName(payload.camera);
                liveFeed.src = `/video_feed?mesh=0&t=${Date.now()}`;
                setMessage('화면 중앙에 검사 부위를 맞춘 뒤 촬영하세요.');
            } catch (error) {
                setMessage(`카메라를 시작하지 못했습니다. 이미지 업로드를 사용해 주세요. (${error.message || error})`, true);
            }
            updatePreviewState();
        }

        async function stopCamera(useBeacon = false) {
            if (!cameraSessionActive) return;
            cameraSessionActive = false;
            liveFeed.removeAttribute('src');
            const payload = JSON.stringify({
                source: 'screening_capture',
                camera_role: modalityConfig?.camera_role || 'webcam'
            });
            if (useBeacon && navigator.sendBeacon) {
                navigator.sendBeacon('/camera/session/stop', new Blob([payload], { type: 'application/json' }));
                return;
            }
            try {
                await fetch('/camera/session/stop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload,
                    keepalive: true
                });
            } catch (error) {}
        }

        function renderCameraName(camera) {
            const cameraName = document.getElementById('camera-name');
            if (isMobile) {
                cameraName.textContent = '모바일 기기 카메라';
                return;
            }
            cameraName.textContent = camera?.connected
                ? `${camera.label || cameraRoleLabel()} · ${camera.name || '카메라'} (${camera.device_path})`
                : `${camera?.label || cameraRoleLabel()} 미연결`;
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'));
                reader.readAsDataURL(blob);
            });
        }

        function resizeImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'));
                reader.onload = () => {
                    const image = new Image();
                    image.onerror = () => reject(new Error('지원하지 않는 이미지입니다.'));
                    image.onload = () => {
                        const maxSize = 1280;
                        const scale = Math.min(1, maxSize / Math.max(image.naturalWidth, image.naturalHeight));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
                        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
                        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.84));
                    };
                    image.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function setCapture(dataUrl) {
            captureData = dataUrl;
            capturedImage.src = dataUrl;
            setMessage('이미지를 확인한 뒤 다음 단계로 이동하세요.');
            updatePreviewState();
        }

        async function captureCameraFrame() {
            inputButton.disabled = true;
            try {
                const response = await fetch(`/video_frame?mesh=0&t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('프레임 요청 실패');
                setCapture(await blobToDataUrl(await response.blob()));
            } catch (error) {
                setMessage(`촬영에 실패했습니다. (${error.message || error})`, true);
            } finally {
                inputButton.disabled = false;
            }
        }

        async function setMode(mode) {
            inputMode = mode;
            captureData = '';
            capturedImage.removeAttribute('src');
            document.getElementById('camera-tab').classList.toggle('active', mode === 'camera');
            document.getElementById('upload-tab').classList.toggle('active', mode === 'upload');
            document.getElementById('camera-tab').setAttribute('aria-selected', mode === 'camera' ? 'true' : 'false');
            document.getElementById('upload-tab').setAttribute('aria-selected', mode === 'upload' ? 'true' : 'false');
            inputButton.textContent = mode === 'camera' ? (isMobile ? '모바일 카메라 열기' : '촬영하기') : '파일 선택';
            if (mode === 'camera') await startCamera(); else await stopCamera();
            updatePreviewState();
        }

        document.getElementById('camera-tab').addEventListener('click', () => setMode('camera'));
        document.getElementById('upload-tab').addEventListener('click', () => setMode('upload'));
        inputButton.addEventListener('click', () => {
            if (inputMode === 'camera' && !isMobile) captureCameraFrame();
            else {
                if (inputMode === 'camera') fileInput.setAttribute('capture', 'environment');
                else fileInput.removeAttribute('capture');
                fileInput.click();
            }
        });
        fileInput.addEventListener('change', async () => {
            const file = fileInput.files && fileInput.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                setMessage('이미지 파일만 선택할 수 있습니다.', true);
                return;
            }
            inputButton.disabled = true;
            setMessage('이미지를 준비하는 중입니다.');
            try { setCapture(await resizeImage(file)); }
            catch (error) { setMessage(error.message || String(error), true); }
            finally { inputButton.disabled = false; fileInput.value = ''; }
        });
        clearButton.addEventListener('click', () => {
            captureData = '';
            capturedImage.removeAttribute('src');
            updatePreviewState();
        });
        continueButton.addEventListener('click', async () => {
            try {
                sessionStorage.setItem(`screening_capture_${active}`, captureData);
                sessionStorage.setItem(`screening_capture_source_${active}`, inputMode);
            } catch (error) {
                setMessage('이미지 저장 공간이 부족합니다. 더 작은 이미지를 선택해 주세요.', true);
                return;
            }
            await stopCamera();
            location.href = '/screening/result';
        });
        window.addEventListener('beforeunload', () => stopCamera(true));

        ScreeningFlow.getConfig().then((config) => {
            modalityConfig = (config.modalities || []).find((item) => item.id === active) || {};
            const position = Math.max(1, plan.indexOf(active) + 1);
            document.getElementById('page-title').textContent = `${modalityConfig.label || ScreeningFlow.LABELS[active]} 이미지 촬영`;
            document.getElementById('progress').textContent = `${position} / ${plan.length}`;
            document.getElementById('modality-label').textContent = modalityConfig.label || ScreeningFlow.LABELS[active];
            document.getElementById('capture-label').textContent = modalityConfig.capture_label || '검사 이미지';
            const cameraRole = modalityConfig.camera_role || 'webcam';
            const camera = config.cameras?.[cameraRole] || config.camera || {};
            renderCameraName(camera);
            setMode('camera');
        }).catch((error) => {
            setMessage('검사 설정을 불러오지 못했습니다.', true);
            updatePreviewState();
        });
    </script>
    <script src="/static/js/timeout.js"></script>
</body>
</html>
