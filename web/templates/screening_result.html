<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검사 결과 - 종합 건강 스크리닝</title>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
        })();
    </script>
    <style>
        :root {
            --primary: #007aff;
            --primary-soft: #eaf3ff;
            --bg: #f5f5f7;
            --surface: #ffffff;
            --text: #172033;
            --sub: #667085;
            --border: #d9e0ea;
            --warning: #9a6700;
            --warning-soft: #fff7dd;
        }
        [data-theme="dark"] {
            --primary: #58a6ff;
            --primary-soft: #142a42;
            --bg: #0f1115;
            --surface: #171b22;
            --text: #eef2f7;
            --sub: #a7b0bf;
            --border: #303846;
            --warning: #f0c45c;
            --warning-soft: #342c17;
        }
        * { box-sizing: border-box; }
        body { margin: 0; width: 100%; min-height: 800px; background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        .page { min-height: 800px; padding: 34px 54px 38px; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 22px; }
        .eyebrow { color: var(--primary); font-weight: 800; margin-bottom: 7px; }
        h1 { margin: 0; font-size: 2.15rem; letter-spacing: 0; }
        .status { padding: 8px 12px; border-radius: 6px; background: var(--warning-soft); color: var(--warning); font-size: 0.84rem; font-weight: 800; }
        .workspace { flex: 1; display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(380px, 1fr); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
        .image-panel { min-width: 0; padding: 22px; background: #0d1117; display: grid; place-items: center; }
        .image-panel img { width: 100%; height: 100%; max-height: 548px; object-fit: contain; }
        .result-panel { border-left: 1px solid var(--border); padding: 26px 24px; display: flex; flex-direction: column; }
        .result-panel h2 { margin: 0 0 8px; font-size: 1.25rem; }
        .result-intro { margin: 0 0 22px; color: var(--sub); line-height: 1.55; }
        .class-list { border-top: 1px solid var(--border); }
        .class-row { min-height: 58px; display: flex; justify-content: space-between; align-items: center; gap: 18px; border-bottom: 1px solid var(--border); }
        .class-name { font-weight: 800; overflow-wrap: anywhere; }
        .class-value { color: var(--sub); font-variant-numeric: tabular-nums; }
        .capture-meta { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .meta-item { padding: 13px; border-radius: 8px; background: var(--bg); }
        .meta-label { color: var(--sub); font-size: 0.78rem; font-weight: 700; margin-bottom: 5px; }
        .meta-value { font-weight: 800; }
        .notice { margin-top: auto; padding: 15px; border: 1px solid var(--border); border-radius: 8px; color: var(--sub); font-size: 0.88rem; line-height: 1.55; }
        footer { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 18px; }
        .btn { min-height: 50px; padding: 0 24px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 1rem; font-weight: 800; cursor: pointer; }
        .btn-primary { min-width: 210px; background: var(--primary); color: #fff; border-color: var(--primary); }
        @media (max-width: 768px) {
            body { width: 100%; min-height: 100vh; }
            .page { min-height: 100vh; padding: 20px 14px 26px; }
            header { align-items: flex-start; flex-direction: column; gap: 12px; }
            h1 { font-size: 1.75rem; }
            .workspace { grid-template-columns: 1fr; }
            .image-panel { min-height: 310px; padding: 12px; }
            .image-panel img { max-height: 420px; }
            .result-panel { border-left: 0; border-top: 1px solid var(--border); padding: 20px 16px; }
            .capture-meta { grid-template-columns: 1fr; }
            .notice { margin-top: 20px; }
            footer { align-items: stretch; flex-direction: column; }
            footer .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <div>
                <div class="eyebrow">종합 건강 스크리닝 · 촬영 결과</div>
                <h1 id="page-title">이미지 확인</h1>
            </div>
            <div class="status">모델 연결 전</div>
        </header>

        <section class="workspace">
            <div class="image-panel"><img id="result-image" alt="촬영 결과 이미지"></div>
            <div class="result-panel">
                <h2>분석 클래스</h2>
                <p class="result-intro">현재 구성 파일에 등록된 임시 클래스입니다.</p>
                <div id="class-list" class="class-list"></div>
                <div class="capture-meta">
                    <div class="meta-item"><div class="meta-label">검사 영역</div><div id="modality-label" class="meta-value"></div></div>
                    <div class="meta-item"><div class="meta-label">입력 방식</div><div id="source-label" class="meta-value"></div></div>
                </div>
                <div class="notice">학습 모델과 클래스 매핑이 확정되면 이 영역에 예측 결과와 신뢰도, 근거 시각화를 연결합니다. 현재는 촬영 결과만 저장되며 질환 판정은 수행하지 않습니다.</div>
            </div>
        </section>

        <footer>
            <button id="retake-button" class="btn" type="button">다시 촬영</button>
            <button id="continue-button" class="btn btn-primary" type="button">다음 단계</button>
        </footer>
    </main>

    <script src="/static/js/screening-flow.js"></script>
    <script>
        const active = ScreeningFlow.getActive();
        const plan = ScreeningFlow.getPlan();
        if (!['skin', 'scalp'].includes(active) || !plan.includes(active)) location.replace('/screening');

        const captureKey = `screening_capture_${active}`;
        const captureData = sessionStorage.getItem(captureKey) || '';
        if (!captureData) location.replace('/screening/capture');

        ScreeningFlow.markCompleted(active);
        document.getElementById('result-image').src = captureData;
        document.getElementById('retake-button').addEventListener('click', () => location.href = '/screening/capture');
        document.getElementById('continue-button').addEventListener('click', () => ScreeningFlow.continueFlow());

        ScreeningFlow.getConfig().then((config) => {
            const modality = (config.modalities || []).find((item) => item.id === active) || {};
            const label = modality.label || ScreeningFlow.LABELS[active];
            document.getElementById('page-title').textContent = `${label} 이미지 확인`;
            document.getElementById('modality-label').textContent = label;
            document.getElementById('source-label').textContent = (sessionStorage.getItem(`screening_capture_source_${active}`) === 'camera') ? '카메라' : '이미지 업로드';

            const classList = document.getElementById('class-list');
            const classes = Array.isArray(modality.classes) ? modality.classes : [];
            classList.innerHTML = '';
            classes.forEach((className) => {
                const row = document.createElement('div');
                row.className = 'class-row';
                const name = document.createElement('span');
                name.className = 'class-name';
                name.textContent = className;
                const value = document.createElement('span');
                value.className = 'class-value';
                value.textContent = '--';
                row.append(name, value);
                classList.appendChild(row);
            });
            if (!classes.length) classList.textContent = '등록된 클래스가 없습니다.';

            const next = ScreeningFlow.nextPending();
            document.getElementById('continue-button').textContent = next
                ? `다음 검사: ${ScreeningFlow.LABELS[next]}`
                : '통합 결과 보기';
        }).catch(() => {
            document.getElementById('class-list').textContent = '검사 설정을 불러오지 못했습니다.';
        });
    </script>
    <script src="/static/js/timeout.js"></script>
</body>
</html>
