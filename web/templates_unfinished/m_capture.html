        }

        function setupAccessibilityEnhancements() {
            const buttons = document.querySelectorAll('button, input[type="range"]');
            
            buttons.forEach(btn => {
                // 터치 기기에서 포커스 네비게이션 개선
                btn.addEventListener('focus', function() {
                    if (window.matchMedia('(hover: none)').matches) {
                        this.style.outline = '3px solid var(--primary)';
                        this.style.outlineOffset = '2px';
                    }
                });

                btn.addEventListener('blur', function() {
                    this.style.outline = '';
                    this.style.outlineOffset = '';
                });
            });

            // 키보드 네비게이션 개선
            document.addEventListener('keydown', (e) => {
                if (window.matchMedia('(hover: none)').matches) return;

                if (e.key === 'Tab') {
                    document.documentElement.classList.add('keyboard-nav');
                }
            });

            document.addEventListener('mousedown', () => {
                document.documentElement.classList.remove('keyboard-nav');
            });
        }

        function initFluidLayoutSystem() {
            optimizeForScreenSize();
            handleDevicePixelRatio();
            setupAccessibilityEnhancements();

            // 미디어 쿼리 변경 감지
            const mobileQuery = window.matchMedia('(max-width: 768px)');
            const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
            const touchQuery = window.matchMedia('(hover: none)');

            mobileQuery.addEventListener('change', (e) => {
                if (e.matches) {
                    document.body.classList.add('on-mobile');
                } else {
                    document.body.classList.remove('on-mobile');
                }
            });

            darkQuery.addEventListener('change', () => {
                adjustResponsiveLayout();
            });

            touchQuery.addEventListener('change', (e) => {
                if (e.matches) {
                    document.body.classList.add('touch-device');
                } else {
                    document.body.classList.remove('touch-device');
                }
            });

            // 초기 상태 설정
            if (window.matchMedia('(max-width: 768px)').matches) {
                document.body.classList.add('on-mobile');
            }
            if (window.matchMedia('(hover: none)').matches) {
                document.body.classList.add('touch-device');
            }
        }

        // 페이지 로드 후 유동적 레이아웃 시스템 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initFluidLayoutSystem);
        } else {
            initFluidLayoutSystem();
        }

        // ==========================================
        // 고급 유동적 반응형 상태 관리
        // ==========================================
        class FluidResponsiveManager {
            constructor() {
                this.state = {
                    screenCategory: getScreenCategory(),
                    isPortrait: window.matchMedia('(orientation: portrait)').matches,
                    isTouchDevice: window.matchMedia('(hover: none)').matches,
                    darkMode: window.matchMedia('(prefers-color-scheme: dark)').matches,
                    reduceMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
                    highContrast: window.matchMedia('(prefers-contrast: more)').matches,
                };

                this.observers = [];
                this.setupObservers();
                this.applyInitialState();
            }

            setupObservers() {
                // 방향 변화
                window.matchMedia('(orientation: portrait)').addEventListener('change', (e) => {
                    this.state.isPortrait = e.matches;
                    this.notifyObservers('orientation');
                });

                // 컬러 스킴 변화
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    this.state.darkMode = e.matches;
                    this.notifyObservers('colorScheme');
                });

                // 모션 선호 변화
                window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', (e) => {
                    this.state.reduceMotion = e.matches;
                    this.notifyObservers('motion');
                });

                // 명도 대비 선호 변화
                window.matchMedia('(prefers-contrast: more)').addEventListener('change', (e) => {
                    this.state.highContrast = e.matches;
                    this.notifyObservers('contrast');
                });

                // 터치 능력 변화
                window.matchMedia('(hover: none)').addEventListener('change', (e) => {
                    this.state.isTouchDevice = e.matches;
                    this.notifyObservers('touchCapability');
                });
            }

            applyInitialState() {
                const root = document.documentElement;
                root.className = `
                    screen-${this.state.screenCategory}
                    ${this.state.isPortrait ? 'orientation-portrait' : 'orientation-landscape'}
                    ${this.state.isTouchDevice ? 'touch-capable' : 'no-touch'}
                    ${this.state.darkMode ? 'dark-mode' : 'light-mode'}
                    ${this.state.reduceMotion ? 'reduce-motion' : 'motion-ok'}
                    ${this.state.highContrast ? 'high-contrast' : 'normal-contrast'}
                `.trim().split(/\s+/).join(' ');

                this.updateBodyClasses();
            }

            updateBodyClasses() {
                const bodyEl = document.body;
                
                // 스크린 크기 클래스
                bodyEl.classList.remove(
                    'xs-phone', 'sm-phone', 'md-phone',
                    'tablet-portrait', 'tablet-landscape', 'desktop'
                );
                bodyEl.classList.add(this.state.screenCategory);

                // 특성 클래스
                if (this.state.isTouchDevice) {
                    bodyEl.classList.add('touch-device');
                    bodyEl.classList.remove('mouse-device');
                } else {
                    bodyEl.classList.add('mouse-device');
                    bodyEl.classList.remove('touch-device');
                }

                if (this.state.isPortrait) {
                    bodyEl.classList.add('portrait-mode');
                    bodyEl.classList.remove('landscape-mode');
                } else {
                    bodyEl.classList.add('landscape-mode');
                    bodyEl.classList.remove('portrait-mode');
                }

                if (this.state.reduceMotion) {
                    bodyEl.classList.add('disable-animations');
                } else {
                    bodyEl.classList.remove('disable-animations');
                }
            }

            subscribe(callback) {
                this.observers.push(callback);
                return () => {
                    this.observers = this.observers.filter(obs => obs !== callback);
                };
            }

            notifyObservers(changeType) {
                this.state.screenCategory = getScreenCategory();
                this.updateBodyClasses();
                this.observers.forEach(obs => obs(changeType, this.state));
            }

            getState() {
                return { ...this.state };
            }
        }

        // 전역 반응형 매니저 인스턴스
        const fluidManager = new FluidResponsiveManager();

        // 반응형 상태 변화 구독 예시
        fluidManager.subscribe((changeType, state) => {
            if (changeType === 'orientation' && !state.isPortrait) {
                // 가로 모드: 우측 패널 스크롤 활성화
                const rightPanel = document.querySelector('.right-panel');
                if (rightPanel && state.screenCategory.includes('phone')) {
                    rightPanel.classList.add('touch-scroll');
                }
            }
        });

        // ==========================================
        // 유동적 레이아웃 계산 함수
        // ==========================================
        function calculateFluidDimensions() {
            const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
            const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);

            const dimensions = {
                vw,
                vh,
                isMobile: vw <= 768,
                isTablet: vw > 768 && vw <= 1024,
                isDesktop: vw > 1024,
                isLandscape: vh < vw,
                isTall: vh > 1200,
                isCompact: vh < 600,
                aspectRatio: vw / vh,
            };

            return dimensions;
        }

        // 레이아웃 계산을 주기적으로 업데이트
        let layoutCheckInterval = null;

        function startLayoutMonitoring() {
            layoutCheckInterval = setInterval(() => {
                const dims = calculateFluidDimensions();
                document.documentElement.style.setProperty('--viewport-aspect', String(dims.aspectRatio));
            }, 1000);
        }

        function stopLayoutMonitoring() {
            if (layoutCheckInterval) clearInterval(layoutCheckInterval);
        }

        // 페이지 언로드 시 모니터링 중지
        window.addEventListener('beforeunload', stopLayoutMonitoring);

        // 초기 모니터링 시작
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startLayoutMonitoring);
        } else {
            startLayoutMonitoring();
        }


    </script>
    <script>
        (function () {
            const root = document.documentElement;
            function currentTheme() {
                const t = root.getAttribute('data-theme');
                return (t === 'dark' || t === 'light') ? t : 'light';
            }
            function applyTheme(theme, persist) {
                root.setAttribute('data-theme', theme);
                if (persist) {
                    try { localStorage.setItem('theme', theme); } catch (e) {}
                }
                const btn = document.getElementById('global-theme-toggle');
                if (!btn) return;
                const icon = btn.querySelector('[data-role="icon"]');
                const label = btn.querySelector('[data-role="label"]');
                if (theme === 'dark') {
                    if (icon) icon.textContent = '☀️';
                    if (label) label.textContent = '라이트 모드';
                } else {
                    if (icon) icon.textContent = '🌙';
                    if (label) label.textContent = '다크 모드';
                }
            }
            applyTheme(currentTheme(), false);
        })();
    </script>
    <script src="/static/js/timeout.js"></script>
    </body>
    </html>
